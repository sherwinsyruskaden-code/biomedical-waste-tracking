# Render Blueprint: one click deploys the app (Docker) and a PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repository -> Apply.
databases:
  - name: bwts-db
    plan: free
    databaseName: bwts
    user: bwts

services:
  - type: web
    name: biomedical-waste-tracking
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bwts-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      # true = one-click role buttons and clearly labelled sample data (good for a demo). Set to false for real use.
      - key: DEMO_MODE
        value: "true"
